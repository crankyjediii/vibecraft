name: Feature Request
description: Propose a new domain archetype, Brand Studio theme, static audit rule, or workflow command.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Research Scout Archetype / Gotcha Library
        - Brand Studio Theme Preset (WCAG 2.2 AA)
        - Audit Engine v2 Rule (VC0xx)
        - Slash Command / Orchestrator Workflow
        - Installer / Packaging
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or Friction Point
      description: What workflow gap does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Concrete Proposal & Acceptance Criteria
      description: Include measurable thresholds, contrast ratios, or pass/fail examples.
    validations:
      required: true
