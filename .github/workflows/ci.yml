name: CI

on:
  push:
    branches:
      - main
      - "overhaul/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Run unit, lock-block, installer E2E, and markdown link tests
        run: npm test

      - name: Run Audit Engine v2 (VC000..VC018)
        run: npm run audit

      - name: Verify zero generator drift
        run: npm run check:drift

      - name: Run structural and behavioral evaluation suite
        run: npm run evals

      - name: Verify npm package allowlist (dry run)
        run: npm pack --dry-run

  shell-and-powershell:
    name: ShellCheck & PSScriptAnalyzer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            kind: bash
          - os: windows-latest
            kind: pwsh
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Lint install.sh with ShellCheck and bash -n
        if: matrix.kind == 'bash'
        run: |
          bash -n install.sh
          sh -n install.sh || true
          shellcheck install.sh

      - name: Lint install.ps1 with PSScriptAnalyzer
        if: matrix.kind == 'pwsh'
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
          }
          $findings = Invoke-ScriptAnalyzer -Path .\install.ps1 -Severity Error,Warning
          if ($findings) {
            $findings | Format-Table -AutoSize | Out-String | Write-Error
            exit 1
          }

  browser-a11y:
    name: Headless Chromium + axe-core WCAG 2.2 AA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install isolated Playwright + axe-core harness outside repo
        run: |
          mkdir -p /tmp/vc-browser-harness
          npm --prefix /tmp/vc-browser-harness install --no-save --no-audit --no-fund playwright@1.51.1 axe-core@4.10.2
          PLAYWRIGHT_BROWSERS_PATH=/tmp/vc-pw-browsers /tmp/vc-browser-harness/node_modules/.bin/playwright install --with-deps chromium

      - name: Run offline template browser, XSS, fuzz, and axe-core verification
        env:
          PLAYWRIGHT_MODULE_PATH: /tmp/vc-browser-harness/node_modules/playwright
          PLAYWRIGHT_BROWSERS_PATH: /tmp/vc-pw-browsers
          AXE_MIN_JS: /tmp/vc-browser-harness/node_modules/axe-core/axe.min.js
        run: node scripts/verify-templates-browser.mjs
