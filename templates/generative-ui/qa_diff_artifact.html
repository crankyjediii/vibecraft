<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>VibeCraft QA Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
  --bg-primary: #09090b;
  --bg-surface: #18181b;
  --bg-raised: #27272a;
  --fg-primary: #ededef;
  --fg-muted: #9a9aa5;
  --border: rgba(255, 255, 255, 0.08);
  --accent: #5e6ad2;
  --accent-fg: #fafafa;
  --success: #4ade80;
  --warn: #fbbf24;
  --danger: #f87171;
  --radius: 8px;
  --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg-primary: #fbfbfa;
    --bg-surface: #f4f4f1;
    --bg-raised: #e9e9e5;
    --fg-primary: #18181b;
    --fg-muted: #52525b;
    --border: rgba(24, 24, 27, 0.12);
    --accent: #4f58b8;
    --accent-fg: #fafafa;
    --success: #15803d;
    --warn: #a16207;
    --danger: #b91c1c;
  }
}

*, *::before, *::after { box-sizing: border-box; }
.grid > * { min-width: 0; }
html { color-scheme: light dark; }
body { margin: 0; background-color: var(--bg-primary); color: var(--fg-primary); font-family: var(--font-sans); font-size: 15px; line-height: 1.55; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3, p, ul { margin: 0; }
body h1 { font-size: 28px; font-weight: 600; line-height: 1.15; letter-spacing: -0.01em; }
body h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-muted); }
body h3 { font-size: 17px; font-weight: 600; line-height: 1.25; }
ul { padding: 0; list-style: none; }
.mono { font-family: var(--font-mono); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--fg-muted); }

.panel { background-color: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
.verdict { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 9999px; font-weight: 600; font-size: 14px; border: 1px solid var(--border); }
.verdict[data-ok="true"] { color: var(--success); }
.verdict[data-ok="false"] { color: var(--danger); }
.verdict-dot { width: 8px; height: 8px; border-radius: 9999px; background-color: currentColor; }

.kpi-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-muted); }
.kpi-value { font-size: 36px; font-weight: 600; line-height: 1.1; }
.kpi-hero { font-size: 64px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
.meter { height: 10px; border-radius: 9999px; background-color: var(--bg-raised); overflow: hidden; }
.meter-fill { height: 100%; border-radius: 9999px; background-color: var(--success); transform-origin: left center; transform: scaleX(var(--ratio, 0)); transition: transform 250ms ease-out; }
.meter-fill[data-bad="true"] { background-color: var(--danger); }

.table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 14px; }
.table th:not(:first-child), .table td:not(:first-child) { width: 104px; }
.table td:first-child { overflow-wrap: anywhere; }
.table th { text-align: left; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-muted); padding: 8px 0; border-bottom: 1px solid var(--border); }
.table td { padding: 10px 0; border-bottom: 1px solid var(--border); }
.table td:not(:first-child), .table th:not(:first-child) { text-align: right; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chip span {
  display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border-radius: 9999px;
  border: 1px solid var(--border); font-size: 13px; font-weight: 500; color: var(--fg-muted);
  transition: background-color 150ms ease-out, color 150ms ease-out, border-color 150ms ease-out;
}
.chip:hover span { background-color: var(--bg-raised); }
.chip input:checked + span { background-color: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.hunk { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background-color: var(--bg-primary); }
.hunk-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding: 10px 14px; background-color: var(--bg-raised); font-size: 13px; }
.code { margin: 0; padding: 8px 0; font-family: var(--font-mono); font-size: 13px; line-height: 1.6; overflow-x: auto; }
.line { display: grid; grid-template-columns: 28px 1fr; padding: 0 14px 0 0; white-space: pre; }
.line .mark { text-align: center; color: var(--fg-muted); user-select: none; }
.line.del { background-color: color-mix(in srgb, var(--danger) 14%, transparent); }
.line.del .mark { color: var(--danger); }
.line.add { background-color: color-mix(in srgb, var(--success) 14%, transparent); }
.line.add .mark { color: var(--success); }
.reason { padding: 10px 14px; font-size: 13px; color: var(--fg-muted); border-top: 1px solid var(--border); }

.fix { display: grid; grid-template-columns: 24px 1fr; gap: 12px; padding: 14px 0; border-top: 1px solid var(--border); }
.check { width: 20px; height: 20px; border-radius: 9999px; background-color: var(--success); color: var(--bg-primary); display: grid; place-items: center; font-size: 12px; font-weight: 700; }

.stamp { font-family: var(--font-mono); font-size: 14px; padding: 14px 18px; border: 1px solid var(--border); border-radius: var(--radius); background-color: var(--bg-surface); overflow-x: auto; white-space: nowrap; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 16px;
  border-radius: var(--radius); border: 1px solid var(--border); background-color: transparent; color: var(--fg-primary);
  font: inherit; font-weight: 600; font-size: 14px; cursor: pointer;
  transition: background-color 150ms ease-out, transform 150ms ease-out, opacity 150ms ease-out;
}
.btn:hover:not(:disabled) { background-color: var(--bg-raised); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background-color: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn-primary:hover:not(:disabled) { background-color: color-mix(in srgb, var(--accent) 86%, var(--fg-primary)); }
.status { font-size: 13px; color: var(--fg-muted); min-height: 20px; }
.empty { padding: 20px; text-align: center; color: var(--fg-muted); border: 1px dashed var(--border); border-radius: var(--radius); }
.fallback { width: 100%; padding: 12px; background-color: var(--bg-surface); color: var(--fg-primary); border: 1px solid var(--border); border-radius: var(--radius); font-family: var(--font-mono); font-size: 13px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
}
</style>
</head>
<body>
<div class="min-h-screen px-4 py-6 md:px-8 md:py-10">
  <header class="flex flex-wrap items-end justify-between gap-4 pb-8">
    <div class="grid gap-2">
      <h2>Phase 4 of 4 · QA Auditor</h2>
      <h1 id="title"></h1>
    </div>
    <span class="verdict" id="verdict" aria-live="polite"><span class="verdict-dot"></span><span id="verdict-text"></span></span>
  </header>

  <main class="grid gap-6">
    <section class="grid gap-6 lg:grid-cols-[1.4fr_1fr_1fr]" aria-label="Gate summary">
      <div class="panel grid gap-4 content-between">
        <div class="grid gap-1">
          <p class="kpi-label">Token adherence</p>
          <p class="kpi-hero num" id="token-pct"></p>
        </div>
        <div class="grid gap-2">
          <div class="meter" role="meter" id="token-meter" aria-label="Token adherence" aria-valuemin="0" aria-valuemax="100"><div class="meter-fill" id="token-fill"></div></div>
          <p class="muted num" id="token-line"></p>
        </div>
      </div>
      <div class="panel grid gap-2 content-start">
        <p class="kpi-label">Syntax and types</p>
        <p class="kpi-value num" id="syntax-pct"></p>
        <p class="muted num" id="syntax-line"></p>
      </div>
      <div class="panel grid gap-2 content-start">
        <p class="kpi-label">Slop scrubbed</p>
        <p class="kpi-value num" id="slop-count"></p>
        <p class="muted" id="slop-line"></p>
      </div>
    </section>

    <section class="panel grid gap-4" aria-labelledby="tokens-h">
      <h2 id="tokens-h">Token scan by file</h2>
      <p class="mono muted" style="font-size:13px" id="regex-line"></p>
      <table class="table">
        <thead><tr><th scope="col">File</th><th scope="col">Color references</th><th scope="col">Hardcoded</th></tr></thead>
        <tbody id="token-rows"></tbody>
      </table>
    </section>

    <section class="panel grid gap-4" aria-labelledby="diff-h">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <h2 id="diff-h">Anti-slop diff</h2>
        <fieldset class="chips border-0 p-0 m-0" id="filters"><legend class="sr-only">Filter diff by category</legend></fieldset>
      </div>
      <div class="grid gap-4" id="hunks"></div>
    </section>

    <section class="panel grid gap-1" aria-labelledby="fix-h">
      <h2 id="fix-h" class="pb-3">Proactive gotcha fixes applied</h2>
      <ul id="fixes"></ul>
    </section>

    <section class="grid gap-3">
      <div class="stamp" id="stamp" role="status"></div>
      <div class="flex flex-wrap items-center gap-3">
        <button type="button" class="btn btn-primary" id="copy-stamp">Copy audit stamp</button>
        <button type="button" class="btn" id="copy-report">Copy full report</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </div>
      <textarea class="fallback" id="fallback" rows="10" readonly hidden aria-label="Report text (copy manually)"></textarea>
    </section>
  </main>
</div>

<script>
// Auditor agent: replace REPORT with the measured results of the real run. Numbers drive every meter and the stamp.
const REPORT = {
  project: 'Voice memo app · QA report',
  syntax: { files: 42, errors: 0, warnings: 0, checker: 'tsc --noEmit --strict' },
  tokens: {
    regex: '#[0-9a-fA-F]{3,8}\\b|rgba?\\(|hsla?\\(|oklch\\(',
    files: [
      { name: 'src/App.tsx', refs: 48, hardcoded: 0 },
      { name: 'src/components/Recorder.tsx', refs: 71, hardcoded: 0 },
      { name: 'src/components/MemoList.tsx', refs: 64, hardcoded: 0 },
      { name: 'src/components/ProjectSidebar.tsx', refs: 39, hardcoded: 0 },
      { name: 'src/styles/tokens.css', refs: 90, hardcoded: 0, note: 'definitions' }
    ]
  },
  diffs: [
    {
      category: 'comments', file: 'src/hooks/useRecorder.ts',
      reason: 'Narration that restates the code was deleted.',
      lines: [
        { t: 'ctx', s: 'function onChunk(event: BlobEvent): void {' },
        { t: 'del', s: '  // increment chunk counter by 1' },
        { t: 'ctx', s: '  chunkCount += 1;' },
        { t: 'del', s: '  // push the blob to the chunks array' },
        { t: 'ctx', s: '  chunks.push(event.data);' },
        { t: 'ctx', s: '}' }
      ]
    },
    {
      category: 'defensive', file: 'src/lib/projects.ts',
      reason: 'JSON.stringify on a typed Project cannot throw here, so the guard protected an impossible state.',
      lines: [
        { t: 'ctx', s: 'export function serializeProject(project: Project): string {' },
        { t: 'del', s: '  try {' },
        { t: 'del', s: '    return JSON.stringify(project);' },
        { t: 'del', s: '  } catch (error) {' },
        { t: 'del', s: '    return "{}";' },
        { t: 'del', s: '  }' },
        { t: 'add', s: '  return JSON.stringify(project);' },
        { t: 'ctx', s: '}' }
      ]
    },
    {
      category: 'types', file: 'src/lib/db.ts',
      reason: 'The unknown-then-assert cast was replaced by a typed query result.',
      lines: [
        { t: 'ctx', s: 'export async function listMemos(projectId: string): Promise<MemoRow[]> {' },
        { t: 'del', s: '  const rows = (await db.query(sql, [projectId])) as unknown as MemoRow[];' },
        { t: 'add', s: '  const { rows } = await db.query<MemoRow>(sql, [projectId]);' },
        { t: 'ctx', s: '  return rows;' },
        { t: 'ctx', s: '}' }
      ]
    },
    {
      category: 'helpers', file: 'src/components/MemoList.tsx',
      reason: 'A one-use wrapper with no domain meaning was inlined.',
      lines: [
        { t: 'del', s: 'const getMemoCount = (list: Memo[]): number => list.length;' },
        { t: 'ctx', s: '' },
        { t: 'del', s: '<span>{getMemoCount(memos)} memos</span>' },
        { t: 'add', s: '<span>{memos.length} memos</span>' }
      ]
    },
    {
      category: 'tokens', file: 'src/components/Recorder.tsx',
      reason: 'A literal color moved to a token class.',
      lines: [
        { t: 'del', s: '<div style={{ background: "white" }}>' },
        { t: 'add', s: '<div className="bg-surface">' }
      ]
    }
  ],
  fixes: [
    { title: 'IndexedDB quota eviction', detail: 'navigator.storage.persist() is requested on the first saved memo, and Settings has a one-tap export.' },
    { title: 'WebAudio leak on tab unfocus', detail: 'AudioContext closes on visibilitychange and its tracks are stopped, so the mic indicator clears.' },
    { title: 'Transcription blocks the UI thread', detail: 'Whisper runs in a dedicated worker; the main thread only receives text segments.' }
  ]
};

const CATEGORY_LABELS = { all: 'All', comments: 'Comments', defensive: 'Defensive checks', types: 'Type laundering', helpers: 'Helpers', tokens: 'Tokens' };
const $ = (id) => document.getElementById(id);
let statusTimer = 0;

function node(tag, className, text) {
  const n = document.createElement(tag);
  if (className) n.className = className;
  if (text !== undefined) n.textContent = text;
  return n;
}

function totals() {
  const refs = REPORT.tokens.files.reduce((sum, f) => sum + f.refs, 0);
  const bad = REPORT.tokens.files.reduce((sum, f) => sum + f.hardcoded, 0);
  const pct = refs === 0 ? 100 : Math.round((100 * (refs - bad)) / refs);
  const removed = REPORT.diffs.reduce((sum, d) => sum + d.lines.filter((l) => l.t === 'del').length, 0);
  const syntaxOk = REPORT.syntax.errors === 0;
  return { refs, bad, pct, removed, syntaxOk, ok: syntaxOk && bad === 0 };
}

function stampText() {
  const t = totals();
  const slop = t.bad === 0 ? 'Scrubbed' : t.bad + ' Remaining';
  return '🛡️ Auditor: [Syntax: ' + REPORT.syntax.errors + ' Errors] • [Tokens: ' + t.pct + '% Validated] • [Slop: ' + slop + ']';
}

function reportText() {
  const t = totals();
  const out = [REPORT.project, stampText(), '', 'Syntax: ' + REPORT.syntax.files + ' files, ' + REPORT.syntax.errors + ' errors (' + REPORT.syntax.checker + ')', 'Tokens: ' + t.refs + ' color references, ' + t.bad + ' hardcoded', 'Slop lines removed: ' + t.removed, '', 'Gotcha fixes:'];
  REPORT.fixes.forEach((f) => out.push('- ' + f.title + ': ' + f.detail));
  return out.join('\n');
}

function renderSummary() {
  const t = totals();
  $('title').textContent = REPORT.project;
  const verdict = $('verdict');
  verdict.dataset.ok = String(t.ok);
  $('verdict-text').textContent = t.ok ? 'All gates passed' : 'Needs fixes';

  $('token-pct').textContent = t.pct + '%';
  const meter = $('token-meter');
  meter.setAttribute('aria-valuenow', String(t.pct));
  const fill = $('token-fill');
  fill.style.setProperty('--ratio', String(t.pct / 100));
  fill.dataset.bad = String(t.bad > 0);
  $('token-line').textContent = t.refs + ' color references, ' + t.bad + ' hardcoded';

  $('syntax-pct').textContent = t.syntaxOk ? '100% pass' : REPORT.syntax.errors + ' errors';
  $('syntax-line').textContent = REPORT.syntax.files + ' files · ' + REPORT.syntax.checker;
  $('slop-count').textContent = String(t.removed);
  $('slop-line').textContent = 'lines of comment, guard, cast and helper slop removed';

  $('regex-line').textContent = 'rg -n "' + REPORT.tokens.regex + '" src';
  const tbody = $('token-rows');
  REPORT.tokens.files.forEach((f) => {
    const tr = document.createElement('tr');
    const name = node('td', 'mono', f.name + (f.note ? ' (' + f.note + ')' : ''));
    tr.append(name, node('td', 'num', String(f.refs)), node('td', 'num', String(f.hardcoded)));
    tbody.appendChild(tr);
  });
}

function renderHunks(filter) {
  const host = $('hunks');
  host.textContent = '';
  const shown = REPORT.diffs.filter((d) => filter === 'all' || d.category === filter);
  if (shown.length === 0) {
    host.appendChild(node('p', 'empty', 'Nothing was scrubbed in this category.'));
    return;
  }
  shown.forEach((d) => {
    const hunk = node('div', 'hunk');
    const head = node('div', 'hunk-head');
    head.append(node('span', 'mono', d.file), node('span', 'muted', CATEGORY_LABELS[d.category]));
    const code = node('pre', 'code');
    d.lines.forEach((l) => {
      const row = node('div', 'line ' + l.t);
      const mark = node('span', 'mark', l.t === 'del' ? '-' : l.t === 'add' ? '+' : ' ');
      const label = l.t === 'del' ? 'removed: ' : l.t === 'add' ? 'added: ' : '';
      if (label) mark.setAttribute('aria-label', label.trim());
      row.append(mark, node('span', '', l.s));
      code.appendChild(row);
    });
    hunk.append(head, code, node('p', 'reason', d.reason));
    host.appendChild(hunk);
  });
}

function renderFilters() {
  const host = $('filters');
  const present = ['all', ...new Set(REPORT.diffs.map((d) => d.category))];
  present.forEach((key, i) => {
    const label = node('label', 'chip');
    const input = document.createElement('input');
    input.type = 'radio';
    input.name = 'category';
    input.value = key;
    input.checked = i === 0;
    input.addEventListener('change', () => renderHunks(key));
    label.append(input, node('span', '', CATEGORY_LABELS[key]));
    host.appendChild(label);
  });
}

function renderFixes() {
  const host = $('fixes');
  REPORT.fixes.forEach((f) => {
    const li = node('li', 'fix');
    const check = node('span', 'check', '✓');
    check.setAttribute('aria-hidden', 'true');
    const body = node('div', 'grid gap-1');
    body.append(node('h3', '', f.title), node('p', 'muted', f.detail));
    li.append(check, body);
    host.appendChild(li);
  });
}

function legacyCopy(text) {
  const area = document.createElement('textarea');
  area.value = text;
  area.setAttribute('readonly', '');
  area.style.position = 'fixed';
  area.style.opacity = '0';
  document.body.appendChild(area);
  area.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (error) { ok = false; }
  area.remove();
  return ok;
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (error) {
    return legacyCopy(text);
  }
}

async function copyWithFeedback(text, message) {
  const ok = await copyText(text);
  const status = $('status');
  const fallback = $('fallback');
  window.clearTimeout(statusTimer);
  if (ok) {
    status.textContent = message;
    fallback.hidden = true;
    statusTimer = window.setTimeout(() => { status.textContent = ''; }, 3500);
  } else {
    status.textContent = 'Clipboard is blocked here. Copy the selected text below.';
    fallback.value = text;
    fallback.hidden = false;
    fallback.focus();
    fallback.select();
  }
}

renderSummary();
renderFilters();
renderHunks('all');
renderFixes();
$('stamp').textContent = stampText();
$('copy-stamp').addEventListener('click', () => copyWithFeedback(stampText(), 'Audit stamp copied.'));
$('copy-report').addEventListener('click', () => copyWithFeedback(reportText(), 'Full report copied.'));
</script>
</body>
</html>
